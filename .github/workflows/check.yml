name: check

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      # checks.nixos boots a VM. Without access to /dev/kvm qemu falls back to
      # software emulation, which is slow enough to be worth avoiding.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # magic-nix-cache backs onto the Actions cache, so nothing is rebuilt
      # between runs and there is no account or token. It documents only this
      # installer. FlakeHub is its paid tier, and left on it fails the
      # authentication on every run.
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      # Covers the package build (which runs go test), treefmt, and the VM test.
      - run: nix flake check --print-build-logs
